name: Public RAR Viewer DOM Probe
on:
  push:
    paths:
      - "tools/probe_public_viewer.py"
      - ".github/workflows/viewer-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: Inspect public viewer DOM (no user session)
        run: python tools/probe_public_viewer.py
