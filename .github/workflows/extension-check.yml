name: RAR Rescue Extension Checks
on:
  push:
    paths:
      - "extension/**"
      - ".github/workflows/extension-check.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Static JavaScript validation
        run: |
          node --check extension/common.js
          node --check extension/content.js
          node --check extension/background.js
          node --check extension/tests/smoke.cjs
      - name: Security and manifest smoke tests
        run: node extension/tests/smoke.cjs
